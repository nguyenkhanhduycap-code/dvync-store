<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank you | D'Vync</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230d0d0e'/%3E%3Cpath d='M68.6 18.6A36 36 0 1 1 31.4 18.6' fill='none' stroke='%23F2F1EE' stroke-width='9' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='50' r='10' fill='%232FD6A6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body class="light" data-page="thank-you">
  <div data-include="promo"></div>
  <div data-include="header"></div>

  <main>
    <div class="thanks" id="thanks-root">
      <svg class="check-anim" viewBox="0 0 84 84" aria-hidden="true">
        <circle cx="42" cy="42" r="40" fill="none" stroke="#2FD6A6" stroke-width="4"/>
        <path d="M25 43l11 11 23-24" fill="none" stroke="#0b0c0f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1 class="enter-rise" style="animation-delay:250ms">Thank you for your order!</h1>
      <p id="thanks-lead" class="enter-rise" style="animation-delay:350ms">Your order is confirmed. A receipt is on its way to your inbox.</p>
      <div id="order-card" class="enter-rise" style="animation-delay:450ms"></div>
      <p class="enter-rise" style="margin-top:36px;animation-delay:550ms">
        <a class="btn btn-primary" href="index.html">Back to home</a>
        <a class="btn btn-ghost" href="blog.html">Get started with the blog</a>
      </p>
      <p class="demo-note">This is a demo store. No payment was taken and nothing will ship.</p>
    </div>
  </main>

  <div data-include="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/cart.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/site.js"></script>
  <script>
    (function () {
      var DV = window.DV, esc = DV.esc, money = window.Cart.money, order = null;
      try { order = JSON.parse(localStorage.getItem('dvync-last-order')); } catch (e) {}
      if (!order) return;
      var days = order.shipping.id === 'express' ? 2 : 5;
      var eta = new Date(order.date); eta.setDate(eta.getDate() + days);
      document.getElementById('thanks-lead').innerHTML =
        'Thanks, ' + esc(order.name.split(' ')[0]) + '. We\'ve sent a confirmation to <strong>' + esc(order.email) + '</strong>.';
      document.getElementById('order-card').innerHTML =
        '<div class="order-card">' +
          '<dl class="order-meta">' +
            '<div><dt>Order</dt><dd>' + esc(order.number) + '</dd></div>' +
            '<div><dt>Estimated delivery</dt><dd>' + eta.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + '</dd></div>' +
            '<div><dt>Paid with</dt><dd>' + esc(order.card) + '</dd></div>' +
          '</dl>' +
          order.items.map(function (i) {
            return '<div class="mini-line"><div class="mini-img"><img src="' + esc(i.image) + '" alt=""><b>' + i.qty + '</b></div>' +
              '<div><div>' + esc(i.name) + '</div><div class="meta">' + (i.option ? 'Size: ' + esc(i.option) : '') + '</div></div><div>' + money(i.total) + '</div></div>';
          }).join('') +
          '<div>' +
            (order.totals.discount ? '<div class="sum-row discount"><span>Promo ' + esc(order.totals.promo) + '</span><span>−' + money(order.totals.discount) + '</span></div>' : '') +
            '<div class="sum-row"><span>Shipping (' + esc(order.shipping.label.toLowerCase()) + ')</span><span>' + (order.totals.shipping ? money(order.totals.shipping) : 'Free') + '</span></div>' +
            '<div class="sum-row"><span>Tax</span><span>' + money(order.totals.tax) + '</span></div>' +
            '<div class="sum-row total"><span>Total</span><span>' + money(order.totals.total) + '</span></div>' +
          '</div>' +
          '<div class="small muted"><strong style="color:var(--ink)">Shipping to</strong><br>' + order.address.map(esc).join('<br>') + '</div>' +
        '</div>';
    })();
  </script>
</body>
</html>
