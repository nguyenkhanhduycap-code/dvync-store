<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Article | D'Vync</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230d0d0e'/%3E%3Cpath d='M68.6 18.6A36 36 0 1 1 31.4 18.6' fill='none' stroke='%23F2F1EE' stroke-width='9' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='50' r='10' fill='%232FD6A6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body class="light" data-page="post">
  <div data-include="promo"></div>
  <div data-include="header"></div>

  <main id="post-root"></main>

  <div data-include="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/cart.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/site.js"></script>
  <script>
    (function () {
      var DV = window.DV, esc = DV.esc, posts = window.DV_POSTS;
      var root = document.getElementById('post-root');
      var idx = -1, slug = DV.param('slug');
      posts.forEach(function (p, i) { if (p.slug === slug) idx = i; });
      if (idx < 0) {
        root.innerHTML = '<div class="wrap cart-empty"><h2>Article not found.</h2><p>It may have moved.</p><a class="btn btn-dark" href="blog.html">All articles</a></div>';
        return;
      }
      var p = posts[idx];
      document.title = p.title + ' | D\'Vync Blog';
      function block(b, i) {
        if (b[0] === 'h2') return '<h2>' + esc(b[1]) + '</h2>';
        if (b[0] === 'ul') return '<ul>' + b[1].map(function (li) { return '<li>' + esc(li) + '</li>'; }).join('') + '</ul>';
        return '<p' + (i === 0 ? ' class="lede"' : '') + '>' + esc(b[1]) + '</p>';
      }
      var prev = posts[idx - 1], next = posts[idx + 1];
      var au = (window.DV_AUTHORS || {})[p.author];
      var takeaways = p.takeaways && p.takeaways.length
        ? '<div class="callout" style="margin-bottom:36px"><strong>Key takeaways</strong><ul style="margin-top:10px">' +
            p.takeaways.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>'
        : '';
      root.innerHTML =
        '<article>' +
          '<header class="article article-head">' +
            '<nav class="crumbs" style="justify-content:center"><a href="blog.html">Blog</a><span>/</span><span>' + esc(p.tag) + '</span></nav>' +
            '<h1 data-reveal>' + esc(p.title) + '</h1>' +
            '<div class="post-meta" data-reveal="100"><span class="tag">' + esc(p.tag) + '</span><span>' + DV.formatDate(p.date) + '</span><span>· ' + esc(p.read) + '</span></div>' +
            (au ? '<p class="small muted" data-reveal="130" style="margin-top:12px">By ' + esc(au.name) + ', ' + esc(au.role) + '</p>' : '') +
          '</header>' +
          '<div class="article-cover" data-reveal="160"><img src="' + esc(p.image) + '" alt=""></div>' +
          '<div class="article prose">' + takeaways + p.body.map(block).join('') + '</div>' +
          '<div class="article"><div class="callout" style="margin-top:44px">D\'Vync tracks this for you automatically. ' +
            '<a class="link" href="shop.html?cat=memberships">Compare memberships</a>.</div>' +
            '<nav class="article-foot" aria-label="More articles">' +
              (prev ? '<a href="post.html?slug=' + prev.slug + '"><small>← Newer</small><strong>' + esc(prev.title) + '</strong></a>' : '<span></span>') +
              (next ? '<a href="post.html?slug=' + next.slug + '"><small>Older →</small><strong>' + esc(next.title) + '</strong></a>' : '<a href="blog.html"><small>Back to</small><strong>All articles</strong></a>') +
            '</nav></div>' +
        '</article>';
      DV.refresh(root);
    })();
  </script>
</body>
</html>
